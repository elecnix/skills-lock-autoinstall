name: dupdelta

# Reports the duplication a change introduces. Warns, never fails the build.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dupdelta-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dupdelta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the merge-base must be reachable
      - uses: elecnix/dupdelta@v0.3.0
